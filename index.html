<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrifterForDriver Community Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #aaa;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            background-color: #212121;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #333;
            transition: all 0.2s ease-in-out;
        }
        .link-btn:hover {
            background-color: #ff0000;
            border-color: #ff0000;
            transform: translateY(-2px);
        }
        .yt-btn {
            background-color: #cc0000;
        }
        .yt-btn:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DrifterForDriver</h1>
        <p class="subtitle">Official Community Hub & Projects</p>

        <!-- YouTube Link Button -->
        <a href="https://www.youtube.com/@DrifterForDriverPilot" target="_blank" class="link-btn yt-btn">
            ▶️ Visit YouTube Channel
        </a>

        <!-- Community Links -->
        <a href="https://github.com" target="_blank" class="link-btn">
            💻 GitHub Projects
        </a>

        <a href="https://www.roblox.com" target="_blank" class="link-btn">
            🎮 Roblox Group / Profile
        </a>
    </div>
</body>
</html>
