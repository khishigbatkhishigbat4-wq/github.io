<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrifterForDriver Community Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0000;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #aaa;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            background-color: #212121;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #333;
            transition: all 0.2s ease-in-out;
        }
        .link-btn:hover {
            background-color: #ff0000;
            border-color: #ff0000;
            transform: translateY(-2px);
        }
        .yt-btn {
            background-color: #cc0000;
        }
        .yt-btn:hover {
            background-color: #e60000;
        }
        .roblox-btn {
            background-color: #00a2ff;
        }
        .roblox-btn:hover {
            background-color: #0088cc;
            border-color: #0088cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo from Imgur -->
        <img src="https://i.imgur.com/Ndu3nJF.png" alt="DrifterForDriver Logo" class="logo">

        <h1>DrifterForDriver</h1>
        <p class="subtitle">Official Community Hub & Projects</p>

        <!-- YouTube Link -->
        <a href="https://www.youtube.com/@DrifterForDriverPilot" target="_blank" class="link-btn yt-btn">
            ▶️ Visit YouTube Channel
        </a>

        <!-- Roblox Profile Link -->
        <a href="https://www.roblox.com/users/9855852247/profile" target="_blank" class="link-btn roblox-btn">
            🎮 Roblox Profile (@DriftersFriend)
        </a>

        <!-- GitHub Projects Link -->
        <a href="https://github.com/khishigbatkhishigbat4-wq" target="_blank" class="link-btn">
            💻 GitHub Projects
        </a>
    </div>
</body>
</html>
