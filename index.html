<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrifterForDriver Community Hub</title>
    
    <!-- Browser Tab Logo (YouTube Avatar) -->
    <link rel="icon" type="image/png" href="https://yt3.googleusercontent.com/ytc/AIdro_kX4T70eZ2S-g77Vj7NqO5k9N4W_g9vJ3s_G0j5=s800-c-k-c0x00ffffff-no-rj">
    <link rel="shortcut icon" type="image/png" href="https://yt3.googleusercontent.com/ytc/AIdro_kX4T70eZ2S-g77Vj7NqO5k9N4W_g9vJ3s_G0j5=s800-c-k-c0x00ffffff-no-rj">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0000;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #aaa;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            background-color: #212121;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #333;
            transition: all 0.2s ease-in-out;
        }
        .link-btn i {
            font-size: 1.3rem;
        }
        .link-btn:hover {
            transform: translateY(-2px);
        }
        .yt-btn {
            background-color: #cc0000;
        }
        .yt-btn:hover {
            background-color: #e60000;
        }
        .roblox-btn {
            background-color: #000000;
            border-color: #444;
        }
        .roblox-btn:hover {
            background-color: #222222;
        }
        .github-btn {
            background-color: #24292e;
        }
        .github-btn:hover {
            background-color: #333940;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo from YouTube Channel -->
        <img src="https://yt3.googleusercontent.com/ytc/AIdro_kX4T70eZ2S-g77Vj7NqO5k9N4W_g9vJ3s_G0j5=s800-c-k-c0x00ffffff-no-rj" alt="DrifterForDriver Logo" class="logo">

        <h1>DrifterForDriver</h1>
        <p class="subtitle">Official Community Hub & Projects</p>

        <!-- YouTube Link -->
        <a href="https://www.youtube.com/@DrifterForDriverPilot" target="_blank" class="link-btn yt-btn">
            <i class="fa-brands fa-youtube"></i> Visit YouTube Channel
        </a>

        <!-- Roblox Profile Link -->
        <a href="https://www.roblox.com/users/9855852247/profile" target="_blank" class="link-btn roblox-btn">
            <i class="fa-solid fa-gamepad"></i> Roblox Profile (@DriftersFriend)
        </a>

        <!-- GitHub Projects Link -->
        <a href="https://github.com/khishigbatkhishigbat4-wq" target="_blank" class="link-btn github-btn">
            <i class="fa-brands fa-github"></i> GitHub Projects
        </a>
    </div>
</body>
</html>
